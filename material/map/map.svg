<svg id="map_svg"
	 xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     width="100%"
     height="100%"
	 >

<style>
    .wall {
        fill: #fafafa;
        stroke: #222;
        stroke-width: 4;
    }
    .hall {
        fill: #e8e8e8;
        stroke: #222;
        stroke-width: 4;
    }
    .room {
        fill: #fdfdfd;
        stroke: #222;
        stroke-width: 3;
    }
    .door {
        stroke: #1976d2;
        stroke-width: 6;
    }
    .label {
        font-family: Arial, sans-serif;
        font-size: 18px;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #333;
    }
    .title {
        font-family: Arial, sans-serif;
        font-size: 28px;
        font-weight: bold;
    }
</style>

<text class="title" x="800" y="45" text-anchor="middle">
Sample Public Facility Floor Plan
</text>

<!-- 外枠 -->
<rect class="wall" x="40" y="70" width="1520" height="790"/>

<!-- 中央廊下 -->
